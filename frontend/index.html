<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Consult Contacts</title>
</head>



<body>


    <header>
        <h1>
            Consultar Contatos com Tags
        </h1>
    </header>


    <main>

        <div>
            <input type="text" name="tagText" id="tagText" placeholder="Escreva uma tag">
            <button name="consultBtn" id="consultBtn">
                Buscar contatos
            </button>
        </div>

        

        <div class="contacts">
            <div class="table_container">

                <table>
                    <thead>
                        <tr>
                        <th>Nome</th>
                        <th>Contato</th>
                        <th>Nome da Tag</th>
                        </tr>
                    </thead>
                    <tbody id="contactsTableBody">

                    </tbody>
                    </table>
            </div>

        </div>

    </main>


    
</body>



<script src="script.js"></script>
</html>
